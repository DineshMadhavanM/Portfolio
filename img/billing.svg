  <text x="95" y="234" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Client Directory</text>
  <text x="95" y="284" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Payment Gateway</text>
