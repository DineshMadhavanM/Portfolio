  <circle cx="1000" cy="500" r="300" fill="#8b5cf6" opacity="0.1" filter="blur(80px)"/>

  <!-- Main Window Wrapper -->
  <rect x="40" y="35" width="1120" height="605" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

