  <path d="M 40 51 A 16 16 0 0 1 56 35 L 1144 35 A 16 16 0 0 1 1160 51 L 1160 80 L 40 80 Z" fill="rgba(30, 41, 59, 0.6)"/>
  <line x1="40" y1="80" x2="1160" y2="80" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

